<title>River Ranch Studio</title>
<link rel="stylesheet" href="/web/studio.css" />
<div id="down">Lost the server, retrying.</div>
<div id="stage">
  <div id="standby">
    <h2>River Ranch Draft</h2>
    <p>standing by</p>
    <div class="next" id="nextup"></div>
  </div>

  <div id="card">
    <div class="shot">
      <div class="fallback" id="fallback"></div>
      <img id="shot" alt="" />
    </div>
    <div class="who">
      <div class="meta"></div>
      <div class="first"></div>
      <div class="last"></div>
      <div class="row">
        <span class="pill"></span>
        <span class="team"></span>
        <span class="adp"></span>
      </div>
      <div class="to">to <b></b></div>
      <div class="mgr"></div>
    </div>
  </div>
</div>

<div id="clip"></div>
<div id="cliptag"></div>
<div id="sting"><div class="no" id="stingno"></div></div>
<div id="catchup"><h3></h3><div class="list"></div></div>
<div id="slate"></div>
<div id="queue"></div>
<div id="bar"><i></i></div>

<div id="arm">
  <div>
    <h2>Click once to arm audio</h2>
    <p>Chrome will not play sound until this window has been clicked.</p>
  </div>
</div>
<script type="module" src="/web/studio.js"></script>
